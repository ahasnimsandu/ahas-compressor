name: macOS release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag, for example v2.0.0 (creates a GitHub Release)
        required: true
        default: v2.0.0
permissions:
  contents: write
jobs:
  package:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Build arm64 app, validate with Apple tools, create DMG and ZIP
        run: bash macos/build-on-mac.sh "$RUNNER_TEMP/ahas-release"
      - uses: actions/upload-artifact@v4
        with:
          name: AHAS-AppleSilicon
          path: ${{ runner.temp }}/ahas-release/*
      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][A-Za-z0-9.-]+)?$ ]] || { echo 'Invalid release tag'; exit 1; }
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --target "$GITHUB_SHA" --title "AHAS $RELEASE_TAG · Made by Ahas Nimsandu" --notes-file docs/RELEASE-NOTES.md
          fi
          gh release upload "$RELEASE_TAG" "$RUNNER_TEMP/ahas-release/"* --clobber
